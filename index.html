<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lifyar</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lifyar">
<meta name="theme-color" content="#FAFAF7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ring.css">
<link rel="stylesheet" href="onboarding.css">
</head>
<body>
<div id="splash">
  <div class="splash-word">Lifyar</div>
  <div class="splash-credit">Developed by Mersad</div>
</div>
<div id="app">

  <div class="bg-clip">
    <div class="bg-track" id="bgTrack">
      <div class="blob c1" style="width:260px;height:260px;top:-80px;left:2%;animation:drift1 24s ease-in-out infinite alternate;"></div>
      <div class="blob c2" style="width:220px;height:220px;top:150px;left:16%;animation:drift2 27s ease-in-out infinite alternate;"></div>
      <div class="blob c3" style="width:240px;height:240px;bottom:160px;left:4%;animation:drift3 20s ease-in-out infinite alternate;"></div>
      <div class="blob c4" style="width:280px;height:280px;bottom:-130px;left:14%;animation:drift1 25s ease-in-out infinite alternate-reverse;"></div>

      <div class="blob c1" style="width:240px;height:240px;top:-60px;left:32%;animation:drift2 22s ease-in-out infinite alternate;"></div>
      <div class="blob c3" style="width:260px;height:260px;top:280px;left:42%;animation:drift3 26s ease-in-out infinite alternate;"></div>
      <div class="blob c4" style="width:230px;height:230px;bottom:-100px;left:36%;animation:drift1 23s ease-in-out infinite alternate-reverse;"></div>

      <div class="blob c1" style="width:250px;height:250px;top:-70px;left:62%;animation:drift3 24s ease-in-out infinite alternate;"></div>
      <div class="blob c2" style="width:220px;height:220px;top:300px;left:70%;animation:drift1 21s ease-in-out infinite alternate-reverse;"></div>
      <div class="blob c3" style="width:240px;height:240px;bottom:-90px;left:60%;animation:drift2 25s ease-in-out infinite alternate;"></div>

      <div class="blob c2" style="width:260px;height:260px;top:-80px;left:88%;animation:drift1 23s ease-in-out infinite alternate;"></div>
      <div class="blob c3" style="width:230px;height:230px;top:260px;left:94%;animation:drift2 26s ease-in-out infinite alternate-reverse;"></div>
      <div class="blob c4" style="width:250px;height:250px;bottom:-110px;left:90%;animation:drift3 22s ease-in-out infinite alternate;"></div>
    </div>
  </div>

  <header class="top">
    <div id="headerInfo">
      <div class="wordmark">Lifyar</div>
      <div class="date" id="todayLabel"></div>
    </div>
    <div class="header-actions">
      <button class="bell-btn" id="bellBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="bell-badge" id="bellBadge" style="display:none;"></span>
      </button>
      <button class="gear-btn" id="gearBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="viewport" id="viewport">
    <div class="page-track" id="pageTrack">
      <div class="page" id="pageToday">
        <div class="home-hero" id="homeHero">
          <div class="ring-wrap">
            <svg viewBox="0 0 230 230">
              <defs>
                <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="var(--ring-light)"/><stop offset="100%" stop-color="var(--ring-dark)"/>
                </linearGradient>
                <linearGradient id="ringGradAwesome" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="var(--ring-purple-light)"/><stop offset="100%" stop-color="var(--ring-purple-dark)"/>
                </linearGradient>
              </defs>
              <g transform="rotate(-90 115 115)">
                <circle class="ring-track" cx="115" cy="115" r="98"></circle>
                <circle class="ring-progress" id="ringProgress" cx="115" cy="115" r="98"></circle>
                <g class="comet-trail" id="cometTrail"></g>
              </g>
            </svg>
            <div class="ring-center">
              <div class="ring-mini-label" id="ringMiniLabel">Today's score</div>
              <div class="score-hero-fraction" id="scoreFraction"><span class="sf-received" id="sfReceived">0</span><span class="sf-slash">/</span><span class="sf-base" id="sfBase">0</span></div>
              <div class="rating-pill rating-none" id="ratingPill">No rating yet</div>
              <div class="daily-tally" id="dailyTally"></div>
            </div>
          </div>
        </div>
        <div id="homeLists">
          <div class="loading-msg" id="loadingMsg">Loading your data…</div>
        </div>
      </div>
      <div class="page" id="pageRoutines"></div>
      <div class="page" id="pageTasks"></div>
      <div class="page" id="pageScore"></div>
    </div>
    <div id="overlayMain">
      <main id="overlayContent"></main>
    </div>
  </div>

  <div class="fab" id="fab">+</div>
  <nav class="tabs">
    <button data-tab="today" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h12a1 1 0 001-1V10"/><path d="M9 21v-6h6v6"/></svg>
      Home
    </button>
    <button data-tab="routines">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
      Routines
    </button>
    <button data-tab="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Tasks
    </button>
    <button data-tab="score">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
      Score
    </button>
  </nav>
</div>
<div id="onboarding" style="display:none;">
  <div class="bg-clip">
    <div class="bg-track" style="width:100%;">
      <div class="blob c1" style="width:260px;height:260px;top:-80px;left:8%;animation:drift1 24s ease-in-out infinite alternate;"></div>
      <div class="blob c2" style="width:220px;height:220px;top:180px;left:60%;animation:drift2 27s ease-in-out infinite alternate;"></div>
      <div class="blob c3" style="width:240px;height:240px;bottom:200px;left:0%;animation:drift3 20s ease-in-out infinite alternate;"></div>
      <div class="blob c4" style="width:280px;height:280px;bottom:-140px;left:30%;animation:drift1 25s ease-in-out infinite alternate-reverse;"></div>
      <div class="blob c2" style="width:230px;height:230px;bottom:-80px;left:70%;animation:drift2 23s ease-in-out infinite alternate;"></div>
    </div>
  </div>
  <div class="ob-header">
    <div class="ob-back" id="obBackBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="ob-dots" id="obDots"></div>
    <div class="ob-spacer"></div>
  </div>
  <div class="ob-content" id="obContent"></div>
  <div class="ob-footer" id="obFooter"></div>
  <div class="ob-weekday-scrim" id="obWeekdayPopoverScrim">
    <div class="ob-weekday-card">
      <p class="ob-weekday-title" id="obWeekdayPopoverTitle"></p>
      <div class="ob-weekday-grid" id="obWeekdayPopoverGrid"></div>
      <button type="button" class="ob-weekday-confirm" id="obWeekdayPopoverConfirm">Confirm</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="notifBannerStack"></div>
<input type="file" id="restoreFileInput" accept="application/json" style="display:none;" />
<div id="dragTrash">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/><path d="M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/></svg>
</div>

<script src="app-state-core.js"></script>
<script src="app-i18n.js"></script>
<script src="app-rating.js"></script>
<script src="app-consistency.js"></script>
<script src="app-emoji.js"></script>
<script src="app-notif-db.js"></script>
<script src="app-notif-triggers.js"></script>
<script src="app-notif-shared.js"></script>
<script src="app-notifications.js"></script>
<script src="app-drag.js"></script>
<script src="app-render-core.js"></script>
<script src="app-render-today.js"></script>
<script src="app-render-routines.js"></script>
<script src="app-render-tasks.js"></script>
<script src="app-render-progression.js"></script>
<script src="app-render-score.js"></script>
<script src="app-render-settings.js"></script>
<script src="app-render-notifications.js"></script>
<script src="app-modals.js"></script>
<script src="app-onboarding.js"></script>
<script src="app-main.js"></script>
</body>
</html>
